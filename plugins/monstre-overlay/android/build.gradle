// Le module est écrit en Kotlin, mais le projet Android engendré par Capacitor
// ne connaît que Java : son build.gradle racine n'embarque pas le compilateur
// Kotlin. Comme ce fichier racine est régénéré à chaque compilation, on ne peut
// pas l'y ajouter durablement.
//
// D'où ce bloc `buildscript` local : le module apporte son propre compilateur.
// C'est le procédé habituel des modules Capacitor écrits en Kotlin.
buildscript {
    ext.kotlin_version = '1.9.24'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

// Les versions du SDK sont résolues ICI, hors du bloc `android`, et sous des
// noms qui n'appartiennent qu'à nous.
//
// À l'intérieur de `android { }`, écrire `compileSdkVersion` ne désigne pas la
// variable du projet mais la **méthode dépréciée du même nom** portée par le
// greffon Android. Groovy résout la méthode en priorité, `compileSdk` reçoit
// une valeur inutilisable, et Gradle se plaint que « compileSdkVersion n'est
// pas spécifié » — alors qu'on venait justement de le spécifier.
//
// On s'aligne sur les versions de l'application quand elles existent, avec un
// repli sinon : le module doit rester compilable seul.
ext {
    monstreCompileSdk = rootProject.hasProperty('compileSdkVersion') ? rootProject.compileSdkVersion : 34
    monstreMinSdk = rootProject.hasProperty('minSdkVersion') ? rootProject.minSdkVersion : 23
    monstreTargetSdk = rootProject.hasProperty('targetSdkVersion') ? rootProject.targetSdkVersion : 34
}

android {
    namespace "com.monstre.overlay"
    compileSdk monstreCompileSdk

    defaultConfig {
        minSdk monstreMinSdk
        targetSdk monstreTargetSdk
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation project(':capacitor-android')
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
}

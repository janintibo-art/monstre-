<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rappel</title>
    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        font-family: 'Nunito', 'Segoe UI', system-ui, sans-serif;
      }

      #scene {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: flex-end;
        justify-content: flex-start;
        gap: 6px;
      }

      /* La créature est une planche d'images : on décale l'arrière-plan pour
         faire défiler le cycle de marche. Aucun moteur 3D, donc un affichage
         instantané et une consommation négligeable. */
      #bete {
        width: 96px;
        height: 96px;
        flex: none;
        background-repeat: no-repeat;
        background-size: 800% 100%;
        background-position: 0 0;
        transform-origin: bottom center;
        transition: transform 160ms ease;
      }

      #bete.gauche { transform: scaleX(-1); }
      #bete.rentre { animation: partir 640ms ease-in forwards; }

      @keyframes partir {
        to { transform: translateY(30%) scale(0.2); opacity: 0; }
      }

      #bulle {
        max-width: 190px;
        margin-bottom: 42px;
        padding: 8px 11px;
        border-radius: 14px 14px 14px 4px;
        background: rgba(20, 26, 51, 0.94);
        border: 1px solid rgba(255, 183, 74, 0.7);
        color: #e9eef5;
        font-size: 12.5px;
        line-height: 1.3;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
        opacity: 0;
        transform: translateY(6px);
        transition: opacity 240ms ease, transform 240ms ease;
      }

      #bulle.on { opacity: 1; transform: translateY(0); }
      #quand { display: block; margin-top: 2px; color: #ffb74a; font-size: 11px; }
    </style>
  </head>
  <body>
    <div id="scene">
      <div id="bete"></div>
      <div id="bulle"><span id="texte"></span><span id="quand"></span></div>
    </div>

    <script>
      (function () {
        'use strict';
        var bete = document.getElementById('bete');
        var bulle = document.getElementById('bulle');
        var texte = document.getElementById('texte');
        var quand = document.getElementById('quand');

        var IMAGES = 8;
        var frame = 0;
        var marche = false;
        var timer = null;

        // Le cycle ne tourne que pendant la marche : à l'arrêt, on économise
        // aussi bien la batterie que la crédibilité du mouvement.
        function animer() {
          frame = (frame + 1) % IMAGES;
          bete.style.backgroundPosition = (frame * (100 / (IMAGES - 1))) + '% 0';
        }

        function cadence(actif) {
          clearInterval(timer);
          timer = actif ? setInterval(animer, 110) : null;
          if (!actif) {
            bete.style.backgroundPosition = '0 0';
            frame = 0;
          }
        }

        window.setMarche = function (actif) {
          marche = !!actif;
          cadence(marche);
        };

        window.setFlip = function (gauche) {
          bete.classList.toggle('gauche', !!gauche);
        };

        window.rappel = function (message, moment, sprite) {
          if (sprite) bete.style.backgroundImage = 'url("' + sprite + '")';
          texte.textContent = message || '';
          quand.textContent = moment || '';
          bulle.classList.add('on');
          window.setMarche(true);
        };

        // Elle rentre chez elle quand on la touche.
        window.rentre = function () {
          bulle.classList.remove('on');
          bete.classList.add('rentre');
          cadence(false);
        };
      })();
    </script>
  </body>
</html>

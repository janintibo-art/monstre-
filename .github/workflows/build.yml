name: Build APK et EXE

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Les trois cibles partent du meme build web (dossier dist/).
# Chaque job le refait de son cote : c'est plus simple que de se passer
# un artefact, et ca reste rapide.

jobs:
  web:
    name: Build web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # npm ci si le lockfile est versionne (builds reproductibles),
      # npm install sinon. Le lockfile se genere une fois en local :
      # `npm install` puis `git add package-lock.json`.
      - name: Installer les dépendances
        shell: bash
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: dist

  android:
    name: APK Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      # npm ci si le lockfile est versionne (builds reproductibles),
      # npm install sinon. Le lockfile se genere une fois en local :
      # `npm install` puis `git add package-lock.json`.
      - name: Installer les dépendances
        shell: bash
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npm test
      - run: npm run build

      # Le dossier android/ n'est pas versionne : Capacitor le regenere ici.
      - name: Générer le projet Android
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android
          # Icone et ecran de demarrage generes depuis assets/
          npx --yes @capacitor/assets@3 generate --android
          # Les planches de marche vont dans les assets natifs : la fenêtre
          # système qui affiche la créature n'a pas accès au dossier web.
          mkdir -p android/app/src/main/assets/sprites
          cp public/assets/sprites/*.png android/app/src/main/assets/sprites/

      - name: Compiler l'APK de debug
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: monstre-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

  windows:
    name: EXE Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # npm ci si le lockfile est versionne (builds reproductibles),
      # npm install sinon. Le lockfile se genere une fois en local :
      # `npm install` puis `git add package-lock.json`.
      - name: Installer les dépendances
        shell: bash
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npm test
      - run: npm run build

      # portable = un .exe unique lancable ; nsis = un installateur.
      - name: Empaqueter avec electron-builder
        run: npx electron-builder --win portable nsis --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: monstre-windows
          path: |
            release/*.exe

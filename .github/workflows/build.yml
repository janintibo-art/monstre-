name: Build APK et EXE

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Les trois cibles partent du meme build web (dossier dist/).
# Chaque job le refait de son cote : c'est plus simple que de se passer
# un artefact, et ca reste rapide.

jobs:
  web:
    name: Build web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # `npm ci` exige que le fichier de verrouillage corresponde exactement à
      # package.json. Dès qu'une dépendance est ajoutée sans régénérer le
      # verrou, il refuse de travailler et tout le build tombe — y compris les
      # tests, qui n'ont rien à voir.
      #
      # On tente donc `npm ci` d'abord, pour la reproductibilité, et on retombe
      # sur `npm install` s'il refuse, en le disant clairement. Un build qui
      # passe avec un avertissement vaut mieux qu'un build rouge dont la cause
      # n'a rien à voir avec le code.
      - name: Installer les dépendances
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            if npm ci; then
              echo "Dépendances installées depuis le fichier de verrouillage."
            else
              echo "::warning::Le fichier de verrouillage est décalé par rapport à package.json."
              echo "::warning::Régénère-le puis pousse-le : npm install --package-lock-only && git add package-lock.json"
              npm install
            fi
          else
            echo "::warning::Aucun package-lock.json : build non reproductible."
            echo "::warning::Génère-le une fois : npm install --package-lock-only"
            npm install
          fi
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: dist

  android:
    name: APK Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      # npm ci si le lockfile est versionne (builds reproductibles),
      # npm install sinon. Le lockfile se genere une fois en local :
      # `npm install` puis `git add package-lock.json`.
      # `npm ci` exige que le fichier de verrouillage corresponde exactement à
      # package.json. Dès qu'une dépendance est ajoutée sans régénérer le
      # verrou, il refuse de travailler et tout le build tombe — y compris les
      # tests, qui n'ont rien à voir.
      #
      # On tente donc `npm ci` d'abord, pour la reproductibilité, et on retombe
      # sur `npm install` s'il refuse, en le disant clairement. Un build qui
      # passe avec un avertissement vaut mieux qu'un build rouge dont la cause
      # n'a rien à voir avec le code.
      - name: Installer les dépendances
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            if npm ci; then
              echo "Dépendances installées depuis le fichier de verrouillage."
            else
              echo "::warning::Fichier de verrouillage décalé par rapport à package.json."
              echo "::warning::Régénère-le puis pousse-le : npm install --package-lock-only"
              npm install
            fi
          else
            echo "::warning::Aucun package-lock.json : build non reproductible."
            echo "::warning::Génère-le une fois : npm install --package-lock-only"
            npm install
          fi
      - run: npm test
      - run: npm run build

      # Le dossier android/ n'est pas versionne : Capacitor le regenere ici.
      # Le code natif du module doit être présent AVANT que Capacitor assemble
      # le projet Android. S'il manque — typiquement parce qu'un motif de
      # .gitignore l'a exclu — Capacitor échoue sur un « ENOENT » illisible.
      # Mieux vaut le dire ici, en clair.
      - name: Vérifier le module natif
        shell: bash
        run: |
          manquant=0
          for f in plugins/monstre-overlay/android/build.gradle \
                   plugins/monstre-overlay/android/src/main/AndroidManifest.xml \
                   plugins/monstre-overlay/android/src/main/assets/monstre_overlay.html; do
            if [ ! -f "$f" ]; then
              echo "::error::Fichier absent du dépôt : $f"
              manquant=1
            fi
          done
          if [ "$manquant" = "1" ]; then
            echo "::error::Vérifie .gitignore : un motif « android/ » sans barre oblique de tête exclut aussi les modules."
            exit 1
          fi
          echo "Module natif complet."
      - name: Générer le projet Android
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android
          # Icone et ecran de demarrage generes depuis assets/
          npx --yes @capacitor/assets@3 generate --android
          # Les planches de marche vont dans les assets natifs : la fenêtre
          # système qui affiche la créature n'a pas accès au dossier web.
          mkdir -p android/app/src/main/assets/sprites
          cp public/assets/sprites/*.png android/app/src/main/assets/sprites/

      # L'orientation est fixée dans le manifeste plutôt qu'au démarrage de
      # l'application : un appel au lancement arrive parfois avant que
      # l'activité soit prête, et le verrou ne prend pas. Le manifeste, lui,
      # s'applique dès la création de la fenêtre.
      #
      # `sensorLandscape` laisse les deux sens de rotation. Les panneaux peuvent
      # toujours libérer l'orientation à l'exécution : un appel à
      # setRequestedOrientation l'emporte sur le manifeste.
      - name: Verrouiller l'orientation paysage
        shell: bash
        run: |
          manifeste=android/app/src/main/AndroidManifest.xml
          if grep -q 'screenOrientation' "$manifeste"; then
            echo "Orientation déjà définie, rien à faire."
          else
            # Capacitor déclare toujours l'activité ainsi : on s'accroche à ce
            # marqueur plutôt qu'au nom du paquet, qui peut changer.
            sed -i 's|android:name=".MainActivity"|android:name=".MainActivity"\n            android:screenOrientation="sensorLandscape"|' "$manifeste"
          fi
          if grep -q 'screenOrientation' "$manifeste"; then
            echo "Orientation paysage verrouillée."
          else
            echo "::warning::Orientation non appliquée : le manifeste a changé de forme."
          fi
      - name: Compiler l'APK de debug
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: monstre-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

  windows:
    name: EXE Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # npm ci si le lockfile est versionne (builds reproductibles),
      # npm install sinon. Le lockfile se genere une fois en local :
      # `npm install` puis `git add package-lock.json`.
      # `npm ci` exige que le fichier de verrouillage corresponde exactement à
      # package.json. Dès qu'une dépendance est ajoutée sans régénérer le
      # verrou, il refuse de travailler et tout le build tombe — y compris les
      # tests, qui n'ont rien à voir.
      #
      # On tente donc `npm ci` d'abord, pour la reproductibilité, et on retombe
      # sur `npm install` s'il refuse, en le disant clairement. Un build qui
      # passe avec un avertissement vaut mieux qu'un build rouge dont la cause
      # n'a rien à voir avec le code.
      - name: Installer les dépendances
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            if npm ci; then
              echo "Dépendances installées depuis le fichier de verrouillage."
            else
              echo "::warning::Fichier de verrouillage décalé par rapport à package.json."
              echo "::warning::Régénère-le puis pousse-le : npm install --package-lock-only"
              npm install
            fi
          else
            echo "::warning::Aucun package-lock.json : build non reproductible."
            echo "::warning::Génère-le une fois : npm install --package-lock-only"
            npm install
          fi
      - run: npm test
      - run: npm run build

      # portable = un .exe unique lancable ; nsis = un installateur.
      - name: Empaqueter avec electron-builder
        run: npx electron-builder --win portable nsis --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: monstre-windows
          path: |
            release/*.exe
